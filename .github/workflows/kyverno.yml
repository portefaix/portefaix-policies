name: Kyverno / Tests

on:
  push:
    branches:
      - master
    paths:
      - "kyverno/**"
  pull_request:
    branches:
      - master
    paths:
      - "kyverno/**"

jobs:
  kyverno:
    runs-on: ubuntu-latest
    name: Run kyverno
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Validate policies
      uses: gbaeke/kyverno-cli@v1
      with:
        command: |
          kyverno validate ./kyverno

    - name: Test policies
      uses: gbaeke/kyverno-cli@v1
      with:
        command: |
          kyverno test ./kyverno
