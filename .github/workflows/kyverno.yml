name: Kyverno / Tests

on:
  push:
    branches:
      - master
    paths:
      - "kyverno/**"
  pull_request:
    branches:
      - master
    paths:
      - "kyverno/**"

jobs:
  kyverno:
    runs-on: ubuntu-latest
    name: Run kyverno
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Validate policies
      uses: gbaeke/kyverno-cli@v1
      with:
        command: |
          kyverno validate ./kyverno

    - name: Test policies
      uses: gbaeke/kyverno-cli@v1
      with:
        command: |
          kyverno test ./kyverno
