name: Open Policy Agent / Tests

on:
  push:
    branches:
      - master
    paths:
      - "opa/**"
  pull_request:
    branches:
      - master
    paths:
      - "opa/**"

jobs:
  opa:
    name: opa test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: OPA Test
      uses: petroprotsakh/opa-test-action@v2.1
      with:
        options: -f pretty -v
        tests: |
          opa
