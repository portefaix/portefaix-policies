name: Open Policy Agent / Tests

on:
  push:
    branches:
      - master
    paths:
      - "opa/**"
  pull_request:
    branches:
      - master
    paths:
      - "opa/**"

jobs:
  opa:
    name: opa test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - name: OPA Test
      uses: petroprotsakh/opa-test-action@v2.1
      with:
        options: -f pretty -v
        tests: |
          opa
